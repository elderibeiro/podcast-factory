[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-factory"
version = "0.1.0"
description = "Config-driven prompts and a Gemini-powered CLI that help small organizations research, script, and voice a podcast."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Elder Lira" }]
keywords = ["podcast", "gemini", "text-to-speech", "small-business", "newsletter"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
podcast-factory = "podcast_factory.cli:app"

[project.urls]
Homepage = "https://github.com/elderibeiro/podcast-factory"
Documentation = "https://github.com/elderibeiro/podcast-factory#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
